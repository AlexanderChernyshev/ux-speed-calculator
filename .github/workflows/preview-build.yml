# Step 1 of 2 for PR preview links (step 2 is preview-deploy.yml).
#
# Builds the site for a pull request without access to any secrets, so it is safe to run
# on PRs from forks. The build output is handed to preview-deploy.yml as an artifact.

name: Preview build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - run: npm ci

      - run: npm run build

      - name: Record PR number for the deploy step
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number

      - uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: |
            .output/
            pr-number
          # .output is a hidden directory, which is skipped by default
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
